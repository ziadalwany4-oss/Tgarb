<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم - صن ماركت بورسعيد</title>
  <style>
    body { font-family: 'Cairo', sans-serif; padding: 20px; background: #fff9f2; color: #333; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 14px; box-shadow: 0 4px 18px rgba(43,33,28,0.12); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 700; color: #2b211c; }
    input, select, button { width: 100%; padding: 12px; box-sizing: border-box; border-radius: 8px; border: 1px solid #ddd; font-family: 'Cairo', sans-serif; font-size: 15px; }
    button { background: #ff6600; color: white; border: none; font-weight: 800; cursor: pointer; margin-top: 10px; }
    button:hover { background: #e05b00; }
    .hidden { display: none; }
    .product-item { background: #fff1e6; padding: 12px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .logout-btn { background: #d62828; width: auto; margin-bottom: 15px; padding: 8px 16px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. شاشة تسجيل الدخول -->
  <div id="loginSection">
    <h2>تسجيل الدخول لوحة التحكم</h2>
    <form id="loginForm">
      <div class="form-group">
        <label>البريد الإلكتروني:</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="form-group">
        <label>كلمة السر:</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit">دخول</button>
      <p id="loginError" style="color:red; margin-top:10px; font-weight:700;"></p>
    </form>
  </div>

  <!-- 2. لوحة التحكم -->
  <div id="adminSection" class="hidden">
    <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
    <h2>إدارة منتجات صن ماركت</h2>
    
    <form id="productForm">
      <input type="hidden" id="productId">
      <div class="form-group">
        <label>اسم المنتج:</label>
        <input type="text" id="title" required placeholder="مثال: صن مول زيت خليط 900 مل">
      </div>
      <div class="form-group">
        <label>السعر (بالجنيه):</label>
        <input type="number" step="0.01" id="price" required placeholder="65">
      </div>
      <div class="form-group">
        <label>القسم:</label>
        <select id="cat" required>
          <option value="اللحوم">اللحوم</option>
          <option value="دواجن">دواجن</option>
          <option value="الزيوت والسمن">الزيوت والسمن</option>
          <option value="الأجبان">الأجبان</option>
          <option value="الخضروات المجمدة">الخضروات المجمدة</option>
        </select>
      </div>
      <div class="form-group">
        <label>اسم صورة المنتج (أو رابطها):</label>
        <input type="text" id="imageUrl" required placeholder="srft.jpeg">
      </div>
      <button type="submit">حفظ المنتج</button>
    </form>

    <hr style="margin: 20px 0;">
    <h3>المنتجات الحالية في القاعدة:</h3>
    <div id="adminProductsList"></div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC9jimbxh2n-gBO_6RazEdDRDNNA1DtM60",
    authDomain: "project-a52e3.firebaseapp.com",
    databaseURL: "https://project-a52e3-default-rtdb.firebaseio.com",
    projectId: "project-a52e3",
    storageBucket: "project-a52e3.firebasestorage.app",
    messagingSenderId: "30047291261",
    appId: "1:30047291261:web:e8debae481e3acd2906e14"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginSection = document.getElementById('loginSection');
  const adminSection = document.getElementById('adminSection');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.classList.add('hidden');
      adminSection.classList.remove('hidden');
      loadProducts();
    } else {
      loginSection.classList.remove('hidden');
      adminSection.classList.add('hidden');
    }
  });

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
      loginError.innerText = '';
    } catch (error) {
      loginError.innerText = "خطأ في البريد أو كلمة السر!";
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    signOut(auth);
  });

  async function loadProducts() {
    const adminList = document.getElementById('adminProductsList');
    adminList.innerHTML = 'جاري التحميل...';
    try {
      const querySnapshot = await getDocs(collection(db, "products"));
      adminList.innerHTML = '';
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const div = document.createElement('div');
        div.className = 'product-item';
        div.innerHTML = `
          <div><strong>${data.title}</strong> - ${data.price} ج (${data.cat || 'بدون قسم'})</div>
          <div>
            <button onclick="editProduct('${docSnap.id}', '${data.title}', '${data.price}', '${data.imageUrl}', '${data.cat}')" style="background:#ffc107; padding:6px 10px; width:auto; font-size:13px; margin-left:5px;">تعديل</button>
            <button onclick="deleteProduct('${docSnap.id}')" style="background:#d62828; padding:6px 10px; width:auto; font-size:13px;">حذف</button>
          </div>
        `;
        adminList.appendChild(div);
      });
    } catch (err) {
      console.error(err);
    }
  }

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const title = document.getElementById('title').value;
    const price = Number(document.getElementById('price').value);
    const cat = document.getElementById('cat').value;
    const imageUrl = document.getElementById('imageUrl').value;

    if (id) {
      await updateDoc(doc(db, "products", id), { title, price, cat, imageUrl });
    } else {
      await addDoc(collection(db, "products"), { title, price, cat, imageUrl });
    }

    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
    loadProducts();
  });

  window.editProduct = (id, title, price, imageUrl, cat) => {
    document.getElementById('productId').value = id;
    document.getElementById('title').value = title;
    document.getElementById('price').value = price;
    document.getElementById('cat').value = cat || "اللحوم";
    document.getElementById('imageUrl').value = imageUrl;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  window.deleteProduct = async (id) => {
    if (confirm("هل أنت متأكد من الحذف؟")) {
      await deleteDoc(doc(db, "products", id));
      loadProducts();
    }
  };
</script>

</body>
</html>
